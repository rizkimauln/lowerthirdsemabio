<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Lower Third Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Transparent background for OBS */
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Show lower third at the bottom */
            padding-bottom: 50px; /* Some padding from the bottom edge */
        }
        
        #lower-third-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            max-width: 80%; /* Adjust size as needed */
        }

        #lower-third-container.visible {
            opacity: 1;
        }

        #lower-third-img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="lower-third-container">
        <img id="lower-third-img" src="" alt="Lower Third">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('lower-third-container');
        const img = document.getElementById('lower-third-img');

        socket.on('show-gif', (gifName) => {
            console.log("Showing GIF:", gifName);
            
            const url = `/gifs/${encodeURIComponent(gifName)}`;
            
            // Fetch the image as a blob to utilize browser cache and restart animation instantly
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const objectUrl = URL.createObjectURL(blob);
                    
                    // Revoke previous object URL to prevent memory leaks
                    if (img.src.startsWith('blob:')) {
                        URL.revokeObjectURL(img.src);
                    }
                    
                    img.src = objectUrl;
                    
                    img.onload = () => {
                        container.classList.add('visible');
                    };
                })
                .catch(err => console.error("Error fetching GIF:", err));
        });

        socket.on('hide-gif', () => {
            console.log("Hiding GIF");
            container.classList.remove('visible');
            
            // Optionally clear the src after fade out transition completes
            setTimeout(() => {
                if(!container.classList.contains('visible')) {
                    img.src = "";
                }
            }, 500); 
        });
    </script>
</body>
</html>
