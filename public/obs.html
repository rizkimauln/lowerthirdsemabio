<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Lower Third Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Transparent background for OBS */
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Show lower third at the bottom */
            padding-bottom: 50px; /* Some padding from the bottom edge */
        }
        
        #lower-third-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            max-width: 80%; /* Adjust size as needed */
        }

        #lower-third-container.visible {
            opacity: 1;
        }

        #lower-third-img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="lower-third-container">
        <img id="lower-third-img" src="" alt="Lower Third">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('lower-third-container');
        const img = document.getElementById('lower-third-img');

        // Preload all GIFs into memory as Blobs for INSTANT playback
        const preloadedGifs = {};
        
        fetch('/api/gifs')
            .then(res => res.json())
            .then(gifs => {
                console.log("Preloading GIFs into memory...");
                gifs.forEach(gifName => {
                    fetch(`/gifs/${encodeURIComponent(gifName)}`)
                        .then(r => r.blob())
                        .then(blob => {
                            preloadedGifs[gifName] = blob;
                        })
                        .catch(err => console.error("Failed to preload:", gifName));
                });
            });

        socket.on('show-gif', (gifName) => {
            console.log("Showing GIF:", gifName);
            
            const playFromBlob = (blob) => {
                const objectUrl = URL.createObjectURL(blob);
                if (img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(img.src);
                }
                img.src = objectUrl;
                img.onload = () => container.classList.add('visible');
            };

            if (preloadedGifs[gifName]) {
                // Play instantly from memory
                playFromBlob(preloadedGifs[gifName]);
            } else {
                // Fallback if not finished preloading yet
                const url = `/gifs/${encodeURIComponent(gifName)}`;
                fetch(url).then(r => r.blob()).then(playFromBlob).catch(err => console.error(err));
            }
        });

        socket.on('hide-gif', () => {
            console.log("Hiding GIF");
            container.classList.remove('visible');
            
            // Optionally clear the src after fade out transition completes
            setTimeout(() => {
                if(!container.classList.contains('visible')) {
                    img.src = "";
                }
            }, 500); 
        });
    </script>
</body>
</html>
